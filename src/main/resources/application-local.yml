# Local dev profile: run WITHOUT Docker using an embedded H2 database.
# Data persists across restarts in ./data/recruitment.mv.db (file-based).
#
# Run: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
#
# Limitations vs. the Docker/Postgres setup:
#   - No pgvector: embedding-based matching (Stage 2) will need Postgres again.
#   - Flyway is disabled; schema is generated by Hibernate from the entities.
spring:
  datasource:
    url: jdbc:h2:file:./data/recruitment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Hibernate owns the schema in this profile
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false   # V1__init_schema.sql needs Postgres extensions (pgvector)