spring:
  application:
    name: recruitment-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-prod-to-a-long-random-secret-value}
    expiration-ms: 86400000   # 24h
    refresh-expiration-ms: 604800000 # 7d

  python-service:
    base-url: ${PYTHON_SERVICE_URL:http://localhost:8000}

  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      bucket: ${S3_BUCKET:resumes}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /docs
