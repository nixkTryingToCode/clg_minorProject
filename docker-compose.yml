version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recruitment-postgres
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: recruitment_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment_user -d recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: recruitment-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: recruitment-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

